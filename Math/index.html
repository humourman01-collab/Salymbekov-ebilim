<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ebilim - Math</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #pdfViewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <embed
        id="pdfViewer"
        type="application/pdf"
    >

    <script>
        window.onload = function() {
  var url = "Math/Akter_Sahnaj.pdf#toolbar=0&navpanes=0&scrollbar=0";
  var w=window.open(url, '_blank');
  w.focus();
};
        document.addEventListener("DOMContentLoaded", function () {

            const pdfViewer = document.getElementById("pdfViewer");

            const pdfURL =
                "Math/Akter_Sahnaj.pdf#toolbar=0&navpanes=0&scrollbar=0";

            // Automatically load PDF
            pdfViewer.src = pdfURL;

            // Keep PDF responsive
            function resizePDF() {
                pdfViewer.style.width = window.innerWidth + "px";
                pdfViewer.style.height = window.innerHeight + "px";
            }

            resizePDF();

            window.addEventListener("resize", resizePDF);
            window.addEventListener("orientationchange", resizePDF);

        });
    </script>

</body>
</html>
