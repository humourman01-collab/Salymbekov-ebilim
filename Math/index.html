<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ebilim - Math</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #pdfViewer {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <embed
        id="pdfViewer"
        type="application/pdf"
        aria-label="Math PDF"
    >

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const pdfViewer = document.getElementById("pdfViewer");

            // Exact PDF path
            const pdfURL =
                "Math/Akter_Sahnaj.pdf#toolbar=0&navpanes=0&scrollbar=0";

            // Automatically load PDF into the current page
            pdfViewer.setAttribute("src", pdfURL);

            // Responsive sizing
            function resizePDF() {
                pdfViewer.style.width = window.innerWidth + "px";
                pdfViewer.style.height = window.innerHeight + "px";
            }

            resizePDF();

            window.addEventListener("resize", resizePDF);
            window.addEventListener("orientationchange", resizePDF);

        });
    </script>

</body>
</html>
