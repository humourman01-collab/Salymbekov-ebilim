<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ebilim - math</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000} embed{width:100vw;height:100vh;border:0}</style>
</head><body><embed src="Akter Sahnaj.pdf#toolbar=0&navpanes=0" type="application/pdf">
  <script>
      
        window.onload = function() {
            const pdfUrl = 'Math/Akter Sahnaj.pdf';
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = 'downloaded-Akter Sahnaj.pdf'; // Optional: specify downloaded file name
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
</script>
</body></html>
